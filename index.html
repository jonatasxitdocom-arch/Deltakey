<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Key Bypass - Gerador de Chaves</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between">

    <!-- Conteúdo Principal -->
    <div class="max-w-md mx-auto p-6 mt-10 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl w-full">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-indigo-400 tracking-wider">DELTA KEY BYPASS</h1>
            <p class="text-slate-400 text-sm mt-1">Cole seu link do encurtador abaixo para gerar a chave instantaneamente.</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">LINK DO CHECKPOINT (LootLabs / Platoboost)</label>
                <input type="text" id="linkInput" placeholder="https://links.lootlabs.gg/..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>

            <button onclick="gerarChave()" id="btnGerar" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30">
                Gerar Chave Agora
            </button>
        </div>

        <!-- Área de Resultado -->
        <div id="resultadoArea" class="hidden mt-6 pt-4 border-t border-slate-800">
            <label class="block text-xs font-semibold text-emerald-400 mb-1">SUA CHAVE GERADA:</label>
            <div class="flex gap-2">
                <input type="text" id="chaveOutput" readonly class="w-full bg-slate-950 border border-emerald-500/50 rounded-xl px-3 py-2 text-xs text-emerald-300 font-mono focus:outline-none">
                <button onclick="copiarChave()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl text-xs font-bold transition">Copiar</button>
            </div>
        </div>

        <div id="loadingArea" class="hidden text-center mt-4">
            <p class="text-xs text-indigo-400 animate-pulse">⏳ Processando link e burlando sistema...</p>
        </div>
    </div>

    <!-- Rodapé com Botão do Discord -->
    <footer class="text-center py-6 border-t border-slate-900 mt-10">
        <p class="text-slate-500 text-xs mb-3">Precisa de ajuda ou quer entrar na comunidade?</p>
        <a href="https://discord.com" target="_blank" class="inline-block bg-[#5865F2] hover:bg-[#4752C4] text-white text-xs font-bold px-6 py-2.5 rounded-full shadow-lg transition">
            Entrar no Servidor do Discord
        </a>
    </footer>

    <script>
        async function gerarChave() {
            const link = document.getElementById('linkInput').value.trim();
            const resultadoArea = document.getElementById('resultadoArea');
            const loadingArea = document.getElementById('loadingArea');
            const chaveOutput = document.getElementById('chaveOutput');

            if (!link) {
                alert('Por favor, insira um link válido!');
                return;
            }

            resultadoArea.classList.add('hidden');
            loadingArea.classList.remove('hidden');

            try {
                const response = await fetch(`https://api.bypass.vip/bypass?url=${encodeURIComponent(link)}`);
                const data = await response.json();

                loadingArea.classList.add('hidden');

                if (data.status === "success") {
                    let res = data.result;
                    try {
                        const urlObj = new URL(res);
                        const paramD = urlObj.searchParams.get("d");
                        if (paramD) res = paramD;
                    } catch (e) {}

                    chaveOutput.value = res;
                    resultadoArea.classList.remove('hidden');
                } else {
                    alert('Erro: Não foi possível processar este link.');
                }
            } catch (err) {
                loadingArea.classList.add('hidden');
                alert('Erro de conexão com a API de bypass.');
            }
        }

        function copiarChave() {
            const copyText = document.getElementById("chaveOutput");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("Chave copiada com sucesso!");
        }
    </script>
</body>
</html>
